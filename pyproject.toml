[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A learning mini-agent with ReAct, RAG, persistent memory, and code review tools"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["main", "agent_loop", "api", "tools", "compressor", "status_bar", "selftest"]

[tool.setuptools.packages.find]
include = ["code", "memory", "memory.formats", "rag", "tests"]
namespaces = false

[tool.setuptools.package-data]
"rag" = ["data/*.md", "data/*.json", "data_minfa/*.md", "data_review/*.md"]
